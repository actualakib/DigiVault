<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiVault — Password Manager</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div class="page-container">
    <div class="page-header">
      <h1>Password Manager</h1>
      <a class="back-link" href="dashboard.html">← Back to Dashboard</a>
    </div>

    <div class="card">
      <h2 class="section-title" style="margin-top:0">Add Credential</h2>
      <div class="form-grid">
        <div class="form-field"><label>Site Name</label><input id="newSiteName"></div>
        <div class="form-field"><label>Site URL</label><input id="newSiteUrl"></div>
        <div class="form-field"><label>Username</label><input id="newUsername"></div>
        <div class="form-field"><label>Password</label><input id="newPassword" type="password"></div>
        <div class="form-field" style="grid-column: 1 / -1"><label>Notes</label><textarea id="newNotes" rows="2"></textarea></div>
      </div>
      <div class="center-action">
        <button class="primary-button" id="addEntryButton" style="max-width:220px">Save Credential</button>
      </div>
    </div>

    <h2 class="section-title">Saved Credentials</h2>
    <div class="file-list" id="entryList"></div>

    <div class="status-text" id="statusText"></div>
  </div>
</main>
<script type="module" src="js/password-manager.js"></script>
</body>
</html>
