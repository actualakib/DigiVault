<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiVault — Quick Records</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
  <div class="page-container">
    <div class="page-header">
      <h1>Quick Records</h1>
      <a class="back-link" href="dashboard.html">← Back to Dashboard</a>
    </div>

    <div class="card">
      <h2 class="section-title" style="margin-top:0">Your Information</h2>
      <div class="form-grid">
        <div class="form-field"><label>Full Name</label><input id="selfFullName"></div>
        <div class="form-field"><label>Passport Number</label><input id="selfPassport"></div>
        <div class="form-field"><label>NID Number</label><input id="selfNid"></div>
        <div class="form-field"><label>Birth Certificate Number</label><input id="selfBirthCert"></div>
        <div class="form-field" style="grid-column: 1 / -1"><label>Transcript Details</label><textarea id="selfTranscript" rows="2"></textarea></div>
      </div>

      <h3 class="section-title">Bank Accounts</h3>
      <div id="selfBankAccounts"></div>
      <button class="secondary-button" id="addSelfBankButton" style="max-width:220px">+ Add Bank Account</button>

      <div class="center-action">
        <button class="primary-button" id="saveSelfButton" style="max-width:260px">Save My Information</button>
      </div>
    </div>

    <h2 class="section-title">Family Members (optional)</h2>
    <div id="familyList"></div>
    <div class="center-action">
      <button class="secondary-button" id="addFamilyButton" style="max-width:260px">+ Add Family Member</button>
    </div>

    <div class="status-text" id="statusText"></div>
  </div>
</main>
<script type="module" src="js/quick-records.js"></script>
</body>
</html>
